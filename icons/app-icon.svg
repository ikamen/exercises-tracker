<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vitruvian figure inside a circle and a square">
  <style>
    .frame { fill: none; stroke: #97a0b5; stroke-width: 4; opacity: 0.55; }
    g { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .edge { stroke: #c3c9d6; }
    .body { stroke: #1b2230; }
    .alt { stroke: #5b63d6; }
    .detail { fill: none; stroke: #c3c9d6; stroke-width: 2.2; stroke-linecap: round; opacity: 0.75; }
  </style>

  <!-- Same look as the muscle-group icons: dark body, light outline, accent highlight.
       Each pose is drawn twice, wide in the outline colour and then narrower in the
       fill colour, so its limbs merge into one silhouette with a single outer outline. -->

  <rect width="512" height="512" fill="#10151f" />

  <!-- Shifted down so the circle sits in the middle of the tile -->
  <g transform="translate(0 24)">

  <!-- Circle centred on the navel, square from head to feet -->
  <circle class="frame" cx="256" cy="232" r="198" />
  <rect class="frame" x="96" y="110" width="320" height="320" />

  <!-- Second pose, behind: arms raised to the circle, legs spread -->
  <g class="edge">
    <path d="M226 178 L101 121 M286 178 L411 121" stroke-width="19" />
    <path d="M244 266 L206 332 L168 397 M268 266 L306 332 L344 397" stroke-width="26" />
  </g>
  <g class="alt">
    <path d="M226 178 L101 121 M286 178 L411 121" stroke-width="15" />
    <path d="M244 266 L206 332 L168 397 M268 266 L306 332 L344 397" stroke-width="22" />
  </g>

  <!-- Main pose: arms level with the square, legs together -->
  <g class="edge">
    <path d="M222 180 L104 180 M290 180 L408 180" stroke-width="19" />
    <path d="M242 268 L240 345 M270 268 L272 345" stroke-width="30" />
    <path d="M240 345 L241 418 M272 345 L271 418" stroke-width="22" />
    <path d="M240 423 L226 426 M272 423 L286 426" stroke-width="14" />
    <path d="M256 150 L256 172" stroke-width="22" />
    <path d="M212 172 C228 164 284 164 300 172 C300 196 292 214 288 234
      C292 246 292 258 290 272 L222 272 C220 258 220 246 224 234 C220 214 212 196 212 172 Z"
      fill="#c3c9d6" stroke-width="4" />
    <circle cx="256" cy="132" r="22" fill="#c3c9d6" stroke-width="4" />
  </g>
  <g class="body">
    <path d="M222 180 L104 180 M290 180 L408 180" stroke-width="15" />
    <path d="M242 268 L240 345 M270 268 L272 345" stroke-width="26" />
    <path d="M240 345 L241 418 M272 345 L271 418" stroke-width="18" />
    <path d="M240 423 L226 426 M272 423 L286 426" stroke-width="10" />
    <path d="M256 150 L256 172" stroke-width="18" />
    <path d="M212 172 C228 164 284 164 300 172 C300 196 292 214 288 234
      C292 246 292 258 290 272 L222 272 C220 258 220 246 224 234 C220 214 212 196 212 172 Z"
      fill="#1b2230" stroke-width="0" />
    <circle cx="256" cy="132" r="22" fill="#1b2230" stroke-width="0" />
  </g>

  <!-- Muscle definition lines -->
  <path class="detail" d="M226 194 C238 204 250 204 256 198 C262 204 274 204 286 194" />  <!-- chest -->
  <path class="detail" d="M256 208 L256 248" />                                          <!-- abs -->
  <path class="detail" d="M245 220 L267 220 M245 236 L267 236" />
  <path class="detail" d="M228 256 C238 264 248 268 256 270 C264 268 274 264 284 256" /> <!-- groin -->
  <path class="detail" d="M233 343 C237 348 243 348 247 343 M265 343 C269 348 275 348 279 343" /> <!-- knees -->
  <circle cx="256" cy="232" r="2.4" fill="#c3c9d6" opacity="0.75" />                    <!-- navel -->
  </g>
</svg>
